<svg width="170" height="40" viewBox="0 0 170 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmerFB" x1="0" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>
    <clipPath id="clipFB">
      <rect width="170" height="40" rx="10" />
    </clipPath>
  </defs>
  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes sweepFB {
      0% { transform: translateX(-170px); }
      50%, 100% { transform: translateX(170px); }
    }
    .dot { transform-origin: 150px 20px; animation: pulseDot 2.2s ease-in-out 0.8s infinite; }
    .sweep { animation: sweepFB 3.8s ease-in-out 1.2s infinite; }
  </style>
  <g clip-path="url(#clipFB)">
    <rect width="170" height="40" rx="10" fill="#161B22" />
    <rect class="sweep" x="0" y="0" width="170" height="40" fill="url(#shimmerFB)" opacity="0.14" />
    <!-- Facebook Icon -->
    <path transform="translate(16, 10) scale(0.83)" fill="#F59E0B" d="M12 2.04c-5.5 0-10 4.49-10 10.02 0 5 3.66 9.15 8.44 9.9v-7H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.89 3.78-3.89 1.09 0 2.23.19 2.23.19v2.47h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33v7a10 10 0 0 0 8.44-9.9c0-5.53-4.5-10.02-10-10.02z" />
    <text x="48" y="24.5" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.4">Facebook</text>
    <circle class="dot" cx="150" cy="20" r="3.5" fill="#F59E0B" />
  </g>
  <rect x="0.75" y="0.75" width="168.5" height="38.5" rx="9.5" stroke="#30363D" stroke-width="1.5" fill="none" />
