<svg width="170" height="40" viewBox="0 0 170 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shimmerLI" x1="0" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>
    <clipPath id="clipLI">
      <rect width="170" height="40" rx="10" />
    </clipPath>
  </defs>
  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes sweepLI {
      0% { transform: translateX(-170px); }
      50%, 100% { transform: translateX(170px); }
    }
    .dot { transform-origin: 150px 20px; animation: pulseDot 2.2s ease-in-out 0.4s infinite; }
    .sweep { animation: sweepLI 3.8s ease-in-out 0.6s infinite; }
  </style>
  <g clip-path="url(#clipLI)">
    <rect width="170" height="40" rx="10" fill="#161B22" />
