<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cozy Late-Night Dark Desk Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#131922" />
      <stop offset="100%" stop-color="#191E29" />
    </linearGradient>

    <!-- Warm Desk Lamp Ambient Glow -->
    <radialGradient id="lampGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 155) rotate(90) scale(210 260)">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <!-- Laptop Screen Glow -->
    <linearGradient id="screenGrad" x1="635" y1="92" x2="865" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Laptop Body Gradient -->
    <linearGradient id="laptopBase" x1="600" y1="242" x2="900" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Coffee Steam Gradient -->
    <linearGradient id="steamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="1000" height="360" rx="16" />
    </clipPath>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes steamRise {
      0% { transform: translateY(4px); opacity: 0; }
      40% { opacity: 0.55; }
      100% { transform: translateY(-16px); opacity: 0; }
    }
    @keyframes codePulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .cursor { animation: blink 1.1s infinite; }
    .steam1 { animation: steamRise 3.2s ease-in-out infinite; }
    .steam2 { animation: steamRise 3.2s ease-in-out 1.4s infinite; }
    .line1 { animation: codePulse 2.8s ease-in-out infinite; }
    .line2 { animation: codePulse 2.8s ease-in-out 0.6s infinite; }
    .line3 { animation: codePulse 2.8s ease-in-out 1.2s infinite; }
    .float-badge { animation: floatSlow 4.5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background -->
    <rect width="1000" height="360" fill="url(#bgGrad)" />
    <rect width="1000" height="360" fill="url(#lampGlow)" />

    <!-- Subtle Window / Night Stars on Far Right -->
    <circle cx="910" cy="64" r="1.5" fill="#FDE68A" opacity="0.55" />
    <circle cx="946" cy="96" r="1.2" fill="#93C5FD" opacity="0.45" />
    <circle cx="602" cy="72" r="1.5" fill="#93C5FD" opacity="0.45" />
    <circle cx="888" cy="48" r="1.8" fill="#FDE68A" opacity="0.4" />

    <!-- Left Typography: Clean, Human CS Grad Intro -->
    <text x="58" y="102" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.2">~/akibcoderbai</text>

    <text x="58" y="150" fill="#F0F6FC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="0.2">Md. Muntasir Bin Rafique</text>

    <text x="58" y="184" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Computer Science &amp; Engineering Undergrad @ BUET</text>

    <!-- Divider Accent -->
    <rect x="58" y="210" width="56" height="3" rx="1.5" fill="#F59E0B" />

    <!-- Inspiring, Human Tagline -->
    <text x="58" y="248" fill="#E6EDF3" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18.5" font-weight="500">Building, breaking, and learning something new every day.</text>
    <text x="58" y="276" fill="#8B949E" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">Late-night code, clean algorithms, and working software.</text>

    <!-- Right-Side Animated CS Grad Workstation -->
    <g transform="translate(0, 12)">
      <!-- Desk Surface Line -->
      <line x1="560" y1="256" x2="950" y2="256" stroke="#30363D" stroke-width="2" stroke-linecap="round" />
      <rect x="580" y="258" width="350" height="4" rx="2" fill="#090C10" opacity="0.6" />

      <!-- Floating Minimal Code Window / Terminal Chip above Laptop -->
      <g class="float-badge">
        <rect x="822" y="46" width="106" height="28" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" />
        <circle cx="838" cy="60" r="4" fill="#34D399" />
        <text x="850" y="64" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">git push</text>
      </g>

      <!-- Laptop Lid / Outer Frame -->
      <rect x="626" y="84" width="248" height="156" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2" />
      <!-- Laptop Inner Screen -->
      <rect x="635" y="93" width="230" height="138" rx="5" fill="url(#screenGrad)" />

      <!-- Window Dots inside Laptop Screen -->
      <circle cx="648" cy="105" r="3" fill="#F87171" />
      <circle cx="658" cy="105" r="3" fill="#FBBF24" />
      <circle cx="668" cy="105" r="3" fill="#34D399" />

      <!-- Animated Code Lines inside Laptop Screen -->
      <rect class="line1" x="648" y="122" width="74" height="5" rx="2.5" fill="#38BDF8" />
      <rect class="line2" x="728" y="122" width="46" height="5" rx="2.5" fill="#F59E0B" />

      <rect class="line2" x="660" y="136" width="96" height="5" rx="2.5" fill="#94A3B8" />
      <rect class="line3" x="660" y="150" width="128" height="5" rx="2.5" fill="#34D399" />
      <rect class="line1" x="660" y="164" width="64" height="5" rx="2.5" fill="#A78BFA" />
      <rect class="line2" x="730" y="164" width="52" height="5" rx="2.5" fill="#38BDF8" />

      <rect class="line3" x="648" y="182" width="48" height="5" rx="2.5" fill="#F59E0B" />
      <rect class="line1" x="648" y="198" width="92" height="5" rx="2.5" fill="#64748B" />

      <!-- Blinking Terminal Cursor -->
      <rect class="cursor" x="746" y="196" width="6" height="10" rx="1" fill="#34D399" />

      <!-- Laptop Base / Keyboard Deck -->
      <path d="M 602 242 L 898 242 L 888 254 C 886 255.5 883 256 880 256 L 620 256 C 617 256 614 255.5 612 254 Z" fill="url(#laptopBase)" />
      <!-- Trackpad Notch -->
      <rect x="726" y="242" width="48" height="3.5" rx="1.5" fill="#1E293B" />

      <!-- Coffee Mug on Desk (Right of Laptop) -->
      <g transform="translate(908, 218)">
        <!-- Animated Steam Wisps -->
        <path class="steam1" d="M 10 -4 C 7 -10, 14 -14, 10 -20" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
        <path class="steam2" d="M 20 -2 C 17 -8, 24 -12, 20 -18" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
        <!-- Mug Handle -->
        <path d="M 28 10 C 36 10, 36 26, 28 26" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" />
        <!-- Mug Body -->
        <rect x="2" y="4" width="26" height="32" rx="5" fill="#F59E0B" />
        <rect x="2" y="4" width="26" height="6" rx="2" fill="#FBBF24" />
      </g>

      <!-- Small Desk Plant / Succulent (Left of Laptop) -->
      <g transform="translate(568, 214)">
        <!-- Leaves -->
        <ellipse cx="14" cy="14" rx="5" ry="11" transform="rotate(-22 14 14)" fill="#10B981" />
        <ellipse cx="22" cy="12" rx="5" ry="12" fill="#34D399" />
        <ellipse cx="30" cy="14" rx="5" ry="11" transform="rotate(22 30 14)" fill="#10B981" />
        <!-- Pot -->
        <path d="M 10 22 L 34 22 L 30 40 L 14 40 Z" fill="#475569" />
        <rect x="8" y="20" width="28" height="4" rx="2" fill="#64748B" />
      </g>
    </g>
  </g>

  <!-- Subtle Card Border -->
  <rect x="0.75" y="0.75" width="998.5" height="358.5" rx="15.5" stroke="#30363D" stroke-width="1.5" fill="none" />
</svg>